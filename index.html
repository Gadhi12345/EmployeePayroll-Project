<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payroll</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <div class="logo-section">

        <img src="assets/images/logo.png" alt="Employee Payroll Logo">

        <div class="logo-text">
            <h2>EMPLOYEE</h2>
            <h2>PAYROLL</h2>
        </div>

    </div>

    <nav>

        <ul>

            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">Payroll</a></li>
            <li><a href="#">Salary</a></li>
            <li><a href="#">Login</a></li>

        </ul>

    </nav>

</header>
<section class="employee-form">

    <h2>Employee Payroll Form</h2>

    <div class="form-row">

        <label for="name">Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter Full Name">

    </div>
    <div class="form-row">

    <label>Profile Image</label>

    <div class="profile-images">

        <label>
            <input type="radio" name="profile">
            <img src="assets/profile-images/profile1.png" alt="Profile 1">
        </label>

        <label>
            <input type="radio" name="profile">
           <img src="assets/profile-images/profile2.png" alt="Profile 2">
        </label>

        <label>
            <input type="radio" name="profile">
           <img src="assets/profile-images/profile3.png" alt="Profile 3">
        </label>

        <label>
            <input type="radio" name="profile">
            <img src="assets/profile-images/profile3.png" alt="Profile 3">
        </label>

    </div>
        

</div>
<div class="form-row">

    <label>Department</label>

    <div class="department">

        <label><input type="checkbox"> HR</label>
        <label><input type="checkbox"> Sales</label>
        <label><input type="checkbox"> Finance</label>
        <label><input type="checkbox"> Engineer</label>

    </div>

</div>
<div class="form-row">

    <label for="salary">Salary</label>

    <input
        type="range"
        id="salary"
        min="300000"
        max="500000"
        value="400000">

    <span>400000</span>

</div>
<div class="form-row">

    <label>Gender</label>

    <label><input type="radio" name="gender"> Male</label>

    <label><input type="radio" name="gender"> Female</label>

</div>

</section>

</body>
</html>
